<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDWASA</title>
    <link rel="icon" type="image/x-icon" href="Media/logoV2.svg">
    <!-- Styling for Light & Dark Mode -->
    <link rel="stylesheet" href="style.css">
</head>

<!-- Fetch Header & Footer-->
<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('site-header').innerHTML = data;
        });
    fetch('footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('site-footer').innerHTML = data;
        });
</script>

<body>

    <!-- Header & Navigation -->
    <header id="site-header"></header>

    <main>
        <div>
            <h1>Welcome to my Website</h1>
            <p>My name is Eduard Wagener and I am a mathematics student at ETH with a passion for problem-solving and engenieering. 
                In my free time I have been teaching myself digital fabrication skills to bring my ideas to life. In this website I will collect these side projects.</p>
        </div>
    </main>

        <!-- Footer -->
    <footer id="site-footer"></footer>

    <!-- JavaScript for Dark Mode Toggle -->
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        // Check if user has a previously saved theme preference
        const savedTheme = localStorage.getItem('theme');
        
        // Check if the user's OS prefers dark mode
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Apply saved preference or system default on initial load
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        // Handle button click
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                setTheme('light');
            } else {
                setTheme('dark');
            }
        });

        // Function to update the page theme and storage
        function setTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            }
        }
    </script>
</body>
</html>
